<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문PD 커리어 · 캐시카우</title>
  <link rel="stylesheet" href="styles.css?v=cosmos6" />
</head>
<body>
  <canvas id="cosmosCanvas" aria-hidden="true"></canvas>
  <div class="app-shell">
    <!-- 상단 헤더 -->
    <header class="top-header">
      <div class="header-inner">
        <div class="brand-area">
          <div class="brand-logo" aria-hidden="true">M</div>
          <div class="brand-title">
            <h1>
              문PD
              <span class="status-chip" id="syncStatusBadge">로딩중</span>
            </h1>
          </div>
        </div>

        <div class="header-actions">
          <a class="btn btn-outline btn-sm" href="https://docs.google.com/spreadsheets/d/1wReNF82GUdAZb4c0_bFFI2kbU6grpapVz7fZqD2EFQE/edit" target="_blank" rel="noopener" title="구글 시트 DB 열기">
            <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            시트
          </a>
          <a class="btn btn-outline btn-sm" href="https://drive.google.com/drive/folders/1iLuXv3tbem-SzHNn-erlbLdtH2Yxyf5K" target="_blank" rel="noopener" title="구글 드라이브 폴더 열기">
            <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            드라이브
          </a>
          <button type="button" class="btn btn-outline btn-sm" onclick="switchTab('saved')" title="관심공고함">
            <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span id="headerSavedCount" class="num">0</span>
          </button>
          <button type="button" class="btn btn-outline btn-sm" id="headerBatchBtn" onclick="runBatchConvertAndApply()" title="선택 공고 일괄 지원서 변환">
            <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span id="selectedCount" class="num">0</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- KPI 요약 바 -->
      <section class="kpi-grid" aria-label="트랙별 현황">
        <button type="button" class="kpi-card" onclick="switchTab('career')" title="정규·계약직">
          <span class="kpi-label">
            <svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            정규
          </span>
          <span class="kpi-value num" id="kpiCareerCount">0</span>
        </button>
        <button type="button" class="kpi-card" onclick="switchTab('alba')" title="알바·단기">
          <span class="kpi-label">
            <svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            알바
          </span>
          <span class="kpi-value num" id="kpiAlbaCount">0</span>
        </button>
        <button type="button" class="kpi-card" onclick="switchTab('freelance')" title="숨고·외주">
          <span class="kpi-label">
            <svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
            외주
          </span>
          <span class="kpi-value num" id="kpiFreelanceCount">0</span>
        </button>
        <button type="button" class="kpi-card" onclick="switchTab('contests')" title="공모·지원사업">
          <span class="kpi-label">
            <svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            공모
          </span>
          <span class="kpi-value num" id="kpiContestCount">0</span>
        </button>
        <button type="button" class="kpi-card" onclick="switchTab('career_analysis')" title="평균 채용예측률">
          <span class="kpi-label">
            <svg class="ui-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
            평균
          </span>
          <span class="kpi-value num" id="kpiAvgProb">91%</span>
        </button>
      </section>

      <!-- 검색 · 필터 · 실시간 수집 툴바 -->
      <section class="toolbar" aria-label="공고 검색 및 필터">
        <div class="search-box">
          <div class="search-input-wrap">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="키워드 검색"
              oninput="onFilterChanged()"
              onkeydown="if(event.key==='Enter') triggerLiveCrawl()"
            />
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="liveCrawlBtn" onclick="triggerLiveCrawl()" title="키워드 실시간 수집">
            <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            수집
          </button>
          <button type="button" class="btn btn-outline btn-sm" onclick="resetSearchFilter()" title="필터 초기화">초기화</button>
        </div>

        <div class="filter-row">
          <select id="regionFilter" class="filter-select" onchange="onFilterChanged()" aria-label="지역 필터">
            <option value="ALL">전체 지역</option>
            <option value="서울">서울</option>
            <option value="경기·인천">경기·인천</option>
            <option value="부산·울산·경남">부산·울산·경남</option>
            <option value="대구·경북">대구·경북</option>
            <option value="대전·충청">대전·충청</option>
            <option value="광주·전라">광주·전라</option>
            <option value="강원·제주">강원·제주</option>
            <option value="재택·전국">재택·전국</option>
          </select>
          <select id="siteFilter" class="filter-select" onchange="onFilterChanged()" aria-label="사이트 필터">
            <option value="ALL">전체 사이트</option>
          </select>
          <select id="sortFilter" class="filter-select" onchange="onFilterChanged()" aria-label="정렬 기준">
            <option value="DEADLINE_ASC">마감임박순</option>
            <option value="REG_DESC">최신등록순</option>
            <option value="PROB_DESC">합격확률순</option>
          </select>
          <button type="button" class="btn btn-outline btn-sm" id="highProbToggleBtn" onclick="toggleHighProbFilter()" title="채용·수주 예측률 90% 이상 공고만 보기">
            90%+
          </button>
        </div>

        <!-- 빠른 키워드 칩 + 마감 숨김 & 선택 도구 -->
        <div class="toolbar-bottom">
          <div class="summary-chips" id="quickKeywordBar"></div>
          <div class="toolbar-meta-actions">
            <span class="chip num" id="hiddenExpiredBadge" title="일반 목록에서는 마감 공고를 자동 숨김 처리합니다.">마감숨김</span>
            <button type="button" class="btn btn-outline btn-sm" onclick="selectAllVisible()">전체선택</button>
            <button type="button" class="btn btn-outline btn-sm" onclick="clearSelection()">해제</button>
          </div>
        </div>
      </section>

      <!-- 8개 트랙 탭 -->
      <nav class="tabs-nav" aria-label="메인 메뉴">
        <button type="button" class="tab-btn active" data-tab="career" onclick="switchTab('career')">
          정규직 <span class="tab-count num" id="tabCountCareer">0</span>
        </button>
        <button type="button" class="tab-btn" data-tab="alba" onclick="switchTab('alba')">
          알바 <span class="tab-count num" id="tabCountAlba">0</span>
        </button>
        <button type="button" class="tab-btn" data-tab="freelance" onclick="switchTab('freelance')">
          외주 <span class="tab-count num" id="tabCountFreelance">0</span>
        </button>
        <button type="button" class="tab-btn" data-tab="contests" onclick="switchTab('contests')">
          공모 <span class="tab-count num" id="tabCountContests">0</span>
        </button>
        <button type="button" class="tab-btn" data-tab="saved" onclick="switchTab('saved')">
          관심 <span class="tab-count num" id="tabCountSaved">0</span>
        </button>
        <button type="button" class="tab-btn" data-tab="career_analysis" onclick="switchTab('career_analysis')">
          직군분석
        </button>
        <button type="button" class="tab-btn" data-tab="analytics" onclick="switchTab('analytics')">
          이력서
        </button>
        <button type="button" class="tab-btn" data-tab="radar" onclick="switchTab('radar')">
          사이트 <span class="tab-count num" id="tabCountRadar">0</span>
        </button>
      </nav>

      <!-- 컨텐츠 영역 -->
      <section id="tabContentArea"></section>
    </main>
  </div>

  <!-- 선택된 공고 일괄 처리 플로팅 바 -->
  <div class="batch-floating-bar" id="batchFloatingBar" aria-live="polite">
    <span><strong id="floatingSelectedCount" class="num">0</strong>건 선택</span>
    <div class="batch-floating-actions">
      <button type="button" class="btn btn-primary btn-sm" onclick="runBatchConvertAndApply()">일괄지원</button>
      <button type="button" class="btn btn-outline btn-sm" onclick="clearSelection()">해제</button>
    </div>
  </div>

  <!-- 숨겨진 파일 인풋 -->
  <input type="file" id="hiddenResumeFileInput" accept=".json,.txt,.md,.html" style="display:none;" onchange="handleFileUploadSelected(event)" />
  <input type="file" id="hiddenPortfolioFileInput" accept=".mp4,.mov,.pdf,.pptx,.zip,.json,.txt" style="display:none;" onchange="handlePortfolioUploadSelected(event)" />

  <!-- 1) 공고 합격진단 & 사이트 맞춤 변환 모달 -->
  <div class="modal-backdrop" id="docModal" onclick="if(event.target===this) closeDocModal()">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <h3 id="modalTitle" style="font-size:15px;font-weight:600;">합격진단 · 맞춤 지원서</h3>
          <p id="modalSubtitle" style="font-size:12px;color:var(--text-muted);margin-top:2px;"></p>
        </div>
        <button type="button" class="btn btn-outline btn-sm" onclick="closeDocModal()">닫기</button>
      </div>
      <div class="modal-body">
        <div id="modalFitAnalysisBox" class="validation-panel"></div>
        <div id="formatValidationBox" class="validation-panel"></div>
        <div id="modalPortfolioBar" class="one-liner modal-portfolio-bar"></div>
        <textarea id="modalTextarea" class="modal-textarea" oninput="runLiveFormatValidation()"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline btn-sm" onclick="copyModalContent()">복사</button>
        <button type="button" class="btn btn-outline btn-sm" id="modalSaveBtn" onclick="saveModalContentToFile()">저장</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="copyAndOpenTargetSite()">복사 후 지원창</button>
      </div>
    </div>
  </div>

  <!-- 2) 데이터 변경 확인 / 입력 모달 -->
  <div class="modal-backdrop" id="confirmModal" onclick="if(event.target===this) closeConfirmModal()">
    <div class="modal-content confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
      <div class="modal-header">
        <h3 id="confirmModalTitle" style="font-size:15px;font-weight:600;">확인</h3>
        <button type="button" class="btn btn-outline btn-sm" onclick="closeConfirmModal()">닫기</button>
      </div>
      <div class="modal-body">
        <p id="confirmModalMessage" style="font-size:13.5px;color:var(--text-main);line-height:1.5;white-space:pre-line;"></p>
        <div id="confirmModalInputWrap" style="display:none;">
          <input type="text" id="confirmModalInput" class="field-input" autocomplete="off" />
        </div>
        <div id="confirmModalSub" class="one-liner" style="font-size:12px;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline btn-sm" onclick="closeConfirmModal()">취소</button>
        <button type="button" class="btn btn-primary btn-sm" id="confirmProceedBtn">확인</button>
      </div>
    </div>
  </div>

  <div id="toastNotification" class="toast" role="status" aria-live="polite"></div>

  <script src="data/db_seed.js"></script>
  <script src="data/ai_career_seed.js"></script>
  <script src="app.js?v=cosmos6"></script>
</body>
</html>
